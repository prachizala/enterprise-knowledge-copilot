name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e backend/

      - name: Run Backend Test Suite
        env:
          DATABASE_URL: "sqlite+aiosqlite:///copilot_test.db"
          LLM_PROVIDER: "mock"
          EMBEDDING_PROVIDER: "mock"
          ENTITY_EXTRACTION_PROVIDER: "mock"
          RELATIONSHIP_EXTRACTION_PROVIDER: "mock"
          JWT_SECRET_KEY: "ci_pipeline_test_secret_key"
        run: |
          cd backend
          pytest tests/ -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Next.js Build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: |
          cd frontend
          npm run build
