[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-copilot-backend"
version = "0.1.0"
description = "FastAPI backend for Enterprise Knowledge Copilot (Knowledge Graph RAG)"
authors = [{ name = "Enterprise Engineering Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<0.120.0",
    "uvicorn[standard]>=0.28.0,<0.35.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-dotenv>=1.0.1",
    "neo4j>=5.20.0,<6.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "passlib>=1.7.4",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
