# A generic, single database configuration.

[alembic]
# path to migration scripts (relative to this ini file using %(here)s)
script_location = %(here)s/alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = %(here)s

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value, for example: timezone = UTC
timezone = UTC

# version location specification
version_locations = %(here)s/alembic/versions

# version path separator
version_path_separator = os

# the output encoding used when revisions are generated
output_encoding = utf-8

# Default URL is overridden dynamically in env.py from app.core.config.settings
sqlalchemy.url = postgresql+asyncpg://copilot_user:copilot_dev_password@localhost:5432/enterprise_knowledge

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
